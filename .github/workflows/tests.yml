name: ORIVOX Tests
on:
  push:
    branches: [main, build/complete-orivox]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test runtime
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install fastapi==0.116.1 uvicorn==0.35.0 sqlalchemy==2.0.43 python-multipart==0.0.20 passlib[bcrypt]==1.7.4 bcrypt==4.2.1 httpx==0.28.1 soundfile==0.13.1 numpy==2.1.3 pytest==8.4.1
      - name: Compile Python
        run: python -m compileall -q orivox run.py tests
      - name: Run smoke tests
        run: pytest -q
