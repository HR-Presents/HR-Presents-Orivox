name: ORIVOX Windows Desktop

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'orivox/**'
      - 'web/**'
      - 'desktop.py'
      - 'ORIVOX.spec'
      - 'requirements*.txt'
      - 'installer/**'
      - 'scripts/build-windows.ps1'
      - '.github/workflows/windows-build.yml'

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install desktop runtime and packager
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-desktop.txt

      - name: Compile Python sources
        run: python -m compileall -q orivox desktop.py run.py tests

      - name: Run application smoke tests
        run: python -m pytest -q

      - name: Build ORIVOX desktop bundle
        run: python -m PyInstaller --noconfirm --clean ORIVOX.spec

      - name: Verify executable exists
        shell: pwsh
        run: |
          if (-not (Test-Path 'dist\ORIVOX\ORIVOX.exe')) { throw 'ORIVOX.exe was not produced' }
          Get-ChildItem 'dist\ORIVOX\ORIVOX.exe' | Format-List Name,Length,LastWriteTime

      - name: Smoke test packaged runtime
        timeout-minutes: 5
        shell: pwsh
        env:
          ORIVOX_NO_BROWSER: '1'
          ORIVOX_STARTUP_LOG: ${{ runner.temp }}\orivox-startup.log
        run: |
          Remove-Item $env:ORIVOX_STARTUP_LOG -ErrorAction SilentlyContinue
          $proc = Start-Process -FilePath 'dist\ORIVOX\ORIVOX.exe' -ArgumentList '--browser' -PassThru
          try {
            $deadline = (Get-Date).AddMinutes(4)
            $ready = $false
            while ((Get-Date) -lt $deadline) {
              if ($proc.HasExited) {
                if (Test-Path $env:ORIVOX_STARTUP_LOG) { Get-Content $env:ORIVOX_STARTUP_LOG }
                throw "Packaged ORIVOX exited before becoming ready with code $($proc.ExitCode)"
              }
              try {
                $home = Invoke-WebRequest -Uri 'http://127.0.0.1:8765/' -UseBasicParsing -TimeoutSec 3
                $status = Invoke-RestMethod -Uri 'http://127.0.0.1:8765/api/status' -TimeoutSec 5
                if ($home.StatusCode -eq 200 -and $home.Content -match 'ORIVOX' -and $status.version -and $status.models) {
                  $ready = $true
                  break
                }
              } catch {
                Start-Sleep -Seconds 2
              }
            }
            if (-not $ready) {
              Write-Host '--- ORIVOX packaged startup trace ---'
              if (Test-Path $env:ORIVOX_STARTUP_LOG) { Get-Content $env:ORIVOX_STARTUP_LOG } else { Write-Host 'No startup trace was produced' }
              throw 'Packaged ORIVOX did not become healthy within 4 minutes'
            }
            Write-Host 'Packaged ORIVOX runtime smoke test passed'
            if (Test-Path $env:ORIVOX_STARTUP_LOG) { Get-Content $env:ORIVOX_STARTUP_LOG }
          } finally {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build Windows installer
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\ORIVOX.iss'

      - name: Create portable ZIP
        shell: pwsh
        run: Compress-Archive -Path 'dist\ORIVOX\*' -DestinationPath 'dist\ORIVOX-Windows-Portable.zip' -CompressionLevel Optimal

      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: ORIVOX-Windows
          if-no-files-found: error
          retention-days: 14
          path: |
            dist/ORIVOX-Windows-Portable.zip
            dist/installer/ORIVOX-Setup-1.0.0.exe
