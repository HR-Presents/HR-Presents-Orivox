name: ORIVOX Windows Desktop

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'orivox/**'
      - 'web/**'
      - 'desktop.py'
      - 'server.py'
      - 'ORIVOX.spec'
      - 'requirements*.txt'
      - 'installer/**'
      - 'scripts/build-windows.ps1'
      - '.github/workflows/windows-build.yml'
  pull_request:
    paths:
      - 'orivox/**'
      - 'web/**'
      - 'desktop.py'
      - 'server.py'
      - 'ORIVOX.spec'
      - 'requirements*.txt'
      - 'installer/**'
      - 'scripts/build-windows.ps1'
      - '.github/workflows/windows-build.yml'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install desktop runtime and packager
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-desktop.txt

      - name: Compile Python sources
        run: python -m compileall -q orivox desktop.py server.py run.py tests

      - name: Run application smoke tests
        run: python -m pytest -q

      - name: Build ORIVOX desktop bundle
        run: python -m PyInstaller --noconfirm --clean ORIVOX.spec

      - name: Verify executables exist
        shell: pwsh
        run: |
          if (-not (Test-Path 'dist\ORIVOX\ORIVOX.exe')) { throw 'ORIVOX.exe was not produced' }
          if (-not (Test-Path 'dist\ORIVOX\ORIVOX-server.exe')) { throw 'ORIVOX-server.exe was not produced' }
          Get-ChildItem 'dist\ORIVOX\ORIVOX*.exe' | Format-Table Name,Length,LastWriteTime

      - name: Smoke test packaged runtime
        timeout-minutes: 5
        shell: pwsh
        env:
          ORIVOX_NO_BROWSER: '1'
          ORIVOX_STARTUP_LOG: ${{ runner.temp }}\orivox-startup.log
          ORIVOX_DATA_DIR: ${{ runner.temp }}\orivox-packaged-data
          ORIVOX_DB_PATH: ${{ runner.temp }}\orivox-packaged-data\orivox.db
        run: |
          Remove-Item $env:ORIVOX_STARTUP_LOG -ErrorAction SilentlyContinue
          Remove-Item $env:ORIVOX_DATA_DIR -Recurse -Force -ErrorAction SilentlyContinue
          $proc = Start-Process -FilePath 'dist\ORIVOX\ORIVOX.exe' -ArgumentList '--browser' -PassThru
          try {
            $deadline = (Get-Date).AddMinutes(4)
            $ready = $false
            $lastError = $null
            while ((Get-Date) -lt $deadline) {
              if ($proc.HasExited) {
                if (Test-Path $env:ORIVOX_STARTUP_LOG) { Get-Content $env:ORIVOX_STARTUP_LOG }
                throw "Packaged ORIVOX exited before becoming ready with code $($proc.ExitCode)"
              }
              try {
                $health = Invoke-RestMethod -Uri 'http://127.0.0.1:8765/api/health' -TimeoutSec 3
                if (-not $health.ok) { throw 'Health endpoint returned false' }

                $homeResponse = Invoke-WebRequest -Uri 'http://127.0.0.1:8765/' -UseBasicParsing -TimeoutSec 3
                if ($homeResponse.StatusCode -ne 200 -or $homeResponse.Content -notmatch 'ORIVOX') { throw 'Home page validation failed' }

                $status = Invoke-RestMethod -Uri 'http://127.0.0.1:8765/api/status' -TimeoutSec 3
                if (-not $status.version -or -not $status.models) { throw 'Status endpoint validation failed' }

                $email = "packaged-$([guid]::NewGuid().ToString('N'))@orivox.local"
                $registerBody = @{ name = 'Packaged Test'; email = $email; password = 'StrongPass123' } | ConvertTo-Json
                $registered = Invoke-RestMethod -Uri 'http://127.0.0.1:8765/api/auth/register' -Method Post -ContentType 'application/json' -Body $registerBody -TimeoutSec 10
                if (-not $registered.id -or $registered.email -ne $email) { throw 'Packaged registration validation failed' }

                $loginBody = @{ email = $email; password = 'StrongPass123' } | ConvertTo-Json
                $loggedIn = Invoke-RestMethod -Uri 'http://127.0.0.1:8765/api/auth/login' -Method Post -ContentType 'application/json' -Body $loginBody -TimeoutSec 10
                if (-not $loggedIn.id -or $loggedIn.email -ne $email) { throw 'Packaged login validation failed' }

                $uid = $loggedIn.id
                $session = Invoke-RestMethod -Uri "http://127.0.0.1:8765/api/auth/session/$uid" -TimeoutSec 5
                if ($session.id -ne $uid) { throw 'Packaged session validation failed' }

                $settingsBody = @{ values = @{ theme = 'dark'; voice = 'af_heart'; speed = '1.1' } } | ConvertTo-Json -Depth 4
                $savedSettings = Invoke-RestMethod -Uri "http://127.0.0.1:8765/api/settings/$uid" -Method Put -ContentType 'application/json' -Body $settingsBody -TimeoutSec 10
                if ($savedSettings.theme -ne 'dark') { throw 'Packaged settings persistence failed' }

                $ready = $true
                break
              } catch {
                $lastError = $_.Exception.Message
                Start-Sleep -Seconds 2
              }
            }
            if (-not $ready) {
              Write-Host "Last packaged probe error: $lastError"
              Write-Host '--- ORIVOX packaged startup trace ---'
              if (Test-Path $env:ORIVOX_STARTUP_LOG) { Get-Content $env:ORIVOX_STARTUP_LOG } else { Write-Host 'No startup trace was produced' }
              throw 'Packaged ORIVOX did not pass the end-to-end local runtime checks within 4 minutes'
            }
            Write-Host 'Packaged ORIVOX runtime and auth/database smoke tests passed'
            if (Test-Path $env:ORIVOX_STARTUP_LOG) { Get-Content $env:ORIVOX_STARTUP_LOG }
          } finally {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
            Get-Process 'ORIVOX-server' -ErrorAction SilentlyContinue | Stop-Process -Force -ErrorAction SilentlyContinue
          }

      - name: Add portable launcher instructions
        shell: pwsh
        run: |
          @'
          HR-Presents ORIVOX — Windows Portable

          1. Extract this ZIP completely.
          2. Open the extracted ORIVOX folder.
          3. Double-click ORIVOX.exe.
          4. ORIVOX runs locally on your computer. No installer is required.

          Keep all files in this folder together; ORIVOX-server.exe and the bundled runtime are required by ORIVOX.exe.
          '@ | Set-Content -Path 'dist\ORIVOX\README-FIRST.txt' -Encoding UTF8

      - name: Create portable ZIP
        shell: pwsh
        run: Compress-Archive -Path 'dist\ORIVOX\*' -DestinationPath 'dist\ORIVOX-Windows-Portable.zip' -CompressionLevel Optimal

      - name: Upload portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ORIVOX-Windows-Portable
          if-no-files-found: error
          retention-days: 14
          path: dist/ORIVOX-Windows-Portable.zip

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build Windows installer
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\ORIVOX.iss'

      - name: Upload optional installer
        uses: actions/upload-artifact@v4
        with:
          name: ORIVOX-Windows-Installer
          if-no-files-found: error
          retention-days: 14
          path: dist/installer/ORIVOX-Setup-1.0.0.exe

      - name: Publish GitHub release
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'v1.0.0'
          $notes = @'
          HR-Presents ORIVOX v1.0.0

          Primary download: ORIVOX-Windows-Portable.zip

          Download the ZIP, extract it completely, then double-click ORIVOX.exe. No installer is required.
          '@
          if (gh release view $tag 2>$null) {
            gh release upload $tag 'dist\ORIVOX-Windows-Portable.zip' 'dist\installer\ORIVOX-Setup-1.0.0.exe' --clobber
          } else {
            gh release create $tag 'dist\ORIVOX-Windows-Portable.zip' 'dist\installer\ORIVOX-Setup-1.0.0.exe' --title 'HR-Presents ORIVOX v1.0.0' --notes $notes --latest
          }

# main release trigger
